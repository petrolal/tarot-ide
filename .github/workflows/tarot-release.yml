name: Tarot IDE Release (Phase 4 CI/CD)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux-x64:
    name: Linux x64 (.deb & .rpm)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Tarot IDE
        uses: actions/checkout@v4

      - name: Install Linux packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libx11-dev libxkbfile-dev libsecret-1-dev libkrb5-dev fakeroot rpm dpkg-dev

      - name: Setup pnpm & Node.js
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tarot-core unit tests
        run: |
          pnpm exec gulp compile-extension:tarot-core
          node --test "extensions/tarot-core/out/test/**/*.test.js"

      - name: Build Linux x64 minified & installers (.deb / .rpm)
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: |
          pnpm exec gulp vscode-linux-x64-min
          pnpm exec gulp vscode-linux-x64-prepare-deb
          pnpm exec gulp vscode-linux-x64-build-deb
          pnpm exec gulp vscode-linux-x64-prepare-rpm
          pnpm exec gulp vscode-linux-x64-build-rpm

      - name: Upload Linux installers
        uses: actions/upload-artifact@v4
        with:
          name: tarot-ide-linux-x64
          path: |
            .build/linux/deb/amd64/deb/*.deb
            .build/linux/rpm/x86_64/*.rpm

  build-win32-x64:
    name: Windows x64 (Inno Setup)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Build Windows x64 minified
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: pnpm exec gulp vscode-win32-x64-min
      - uses: actions/upload-artifact@v4
        with:
          name: tarot-ide-win32-x64
          path: ../VSCode-win32-x64

  build-darwin-arm64:
    name: macOS arm64
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Build macOS arm64 minified
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: pnpm exec gulp vscode-darwin-arm64-min
      - uses: actions/upload-artifact@v4
        with:
          name: tarot-ide-darwin-arm64
          path: ../VSCode-darwin-arm64

  release:
    name: Publish GitHub Release
    needs: [build-linux-x64, build-win32-x64, build-darwin-arm64]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-artifacts/tarot-ide-linux-x64/**/*.deb
            release-artifacts/tarot-ide-linux-x64/**/*.rpm
          generate_release_notes: true
